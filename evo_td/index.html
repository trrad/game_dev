<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactive Multiplayer Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
        }
        
        #gameCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: crosshair;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1000;
            transition: opacity 0.5s ease-out;
        }
        
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-text {
            color: #eee;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .loading-bar {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .loading-progress {
            height: 100%;
            background: #4a7c7e;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 2px;
        }
        
        .debug-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #eee;
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            font-family: 'Consolas', 'Monaco', monospace;
            min-width: 200px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }
        
        .debug-panel.collapsed {
            transform: translateX(calc(100% - 30px));
        }
        
        .debug-toggle {
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 60px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px 0 0 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-right: none;
        }
        
        .debug-toggle:hover {
            background: rgba(0, 0, 0, 0.9);
        }
        
        .debug-header {
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .debug-stat {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        
        .debug-stat-label {
            color: #aaa;
        }
        
        .debug-stat-value {
            color: #4a7c7e;
            font-weight: bold;
        }
        
        .controls-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #eee;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-text">Loading Reactive Demo...</div>
        <div class="loading-bar">
            <div id="loadingProgress" class="loading-progress"></div>
        </div>
    </div>
    
    <!-- Game Canvas (created by Babylon.js) -->
    <!-- <canvas id="gameCanvas"></canvas> -->
    
    <!-- Debug Panel -->
    <div id="debugPanel" class="debug-panel collapsed">
        <div class="debug-toggle" onclick="toggleDebugPanel()">
            <span id="toggleIcon">◀</span>
        </div>
        <div class="debug-header">DEBUG INFO</div>
        <div class="debug-stat">
            <span class="debug-stat-label">FPS:</span>
            <span class="debug-stat-value" id="fps">--</span>
        </div>
        <div class="debug-stat">
            <span class="debug-stat-label">Entities:</span>
            <span class="debug-stat-value" id="entities">--</span>
        </div>
        <div class="debug-stat">
            <span class="debug-stat-label">Network:</span>
            <span class="debug-stat-value" id="network">--</span>
        </div>
        <div class="debug-stat">
            <span class="debug-stat-label">Player Health:</span>
            <span class="debug-stat-value" id="health">--</span>
        </div>
        <div class="debug-stat">
            <span class="debug-stat-label">Position:</span>
            <span class="debug-stat-value" id="position">--</span>
        </div>
    </div>
    
    <!-- Controls Hint -->
    <div class="controls-hint pulse">
        Click ground to move • Click stations to interact • Right-click for menu
    </div>
    
    <script>
        // Loading simulation
        let progress = 0;
        const loadingInterval = setInterval(() => {
            progress += Math.random() * 30;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadingInterval);
                setTimeout(() => {
                    document.getElementById('loadingScreen').classList.add('hidden');
                }, 500);
            }
            document.getElementById('loadingProgress').style.width = progress + '%';
        }, 200);
        
        // Debug panel toggle
        function toggleDebugPanel() {
            const panel = document.getElementById('debugPanel');
            const icon = document.getElementById('toggleIcon');
            panel.classList.toggle('collapsed');
            icon.textContent = panel.classList.contains('collapsed') ? '◀' : '▶';
        }
        
        // Update debug stats (called from game)
        window.updateDebugStats = function(stats) {
            if (stats.fps !== undefined) {
                document.getElementById('fps').textContent = stats.fps.toFixed(1);
            }
            if (stats.entities !== undefined) {
                document.getElementById('entities').textContent = stats.entities;
            }
            if (stats.network !== undefined) {
                document.getElementById('network').textContent = stats.network;
            }
            if (stats.health !== undefined) {
                document.getElementById('health').textContent = stats.health + '/100';
            }
            if (stats.position !== undefined) {
                document.getElementById('position').textContent = stats.position;
            }
        };
        
        // Keyboard shortcut for debug panel
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F3') {
                e.preventDefault();
                toggleDebugPanel();
            }
        });
        
        // Hide controls hint after first interaction
        let controlsHintTimeout;
        document.addEventListener('click', () => {
            if (controlsHintTimeout) return;
            controlsHintTimeout = setTimeout(() => {
                const hint = document.querySelector('.controls-hint');
                if (hint) {
                    hint.style.opacity = '0';
                    setTimeout(() => hint.remove(), 500);
                }
            }, 3000);
        });
    </script>
</body>
</html>
